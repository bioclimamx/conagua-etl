# Builds the conagua-etl binaries for a published GitHub release and
# attaches them, with SHA256SUMS, to that release.
#
# Only the tool is built here. A deposit is built locally with these
# binaries: `publish` stamps the commit a binary was built from into every
# artifact, so each binary is checked below to carry the release commit and
# a clean tree before it is attached.
#
# workflow_dispatch is a dry run: it builds and checks the binaries and keeps
# them as workflow artifacts, attaching nothing.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: make check
        run: make check

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history and tags, so the binary records the release
          # tag as its version, not a pseudo-version.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        id: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::12}"
          fi
          exe=""
          [ "$GOOS" = "windows" ] && exe=".exe"
          name="conagua-etl_${version}_${GOOS}_${GOARCH}"
          # Everything is written outside the checkout: Go records an
          # untracked file in the working tree as a modified build.
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/$name" "$RUNNER_TEMP/dist"
          # -buildvcs=true fails the build instead of silently omitting the
          # commit when VCS information is unavailable.
          go build -trimpath -buildvcs=true -o "$stage/$name/conagua-etl$exe" ./cmd/conagua-etl
          cp LICENSE NOTICE README.md "$stage/$name/"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "bin=$stage/$name/conagua-etl$exe" >> "$GITHUB_OUTPUT"

      - name: Verify provenance
        env:
          BIN: ${{ steps.build.outputs.bin }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # go version -m reads the build information of a binary for any
          # target platform.
          info="$RUNNER_TEMP/buildinfo.txt"
          go version -m "$BIN" | tee "$info"
          tab=$'\t'
          grep -qxF "${tab}build${tab}vcs.revision=${GITHUB_SHA}" "$info" \
            || { echo "::error::binary does not record commit ${GITHUB_SHA}"; exit 1; }
          grep -qxF "${tab}build${tab}vcs.modified=false" "$info" \
            || { echo "::error::binary was built from a modified tree"; exit 1; }
          if [ "$EVENT" = "release" ]; then
            grep -qE "^${tab}mod${tab}github.com/bioclimamx/conagua-etl${tab}${GITHUB_REF_NAME}(${tab}|$)" "$info" \
              || { echo "::error::binary does not record version ${GITHUB_REF_NAME} (is the tag a semver tag like v0.1.0?)"; exit 1; }
          fi

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          BIN: ${{ steps.build.outputs.bin }}
        run: |
          set -euo pipefail
          "$BIN" --version
          "$BIN" --version | grep -qF "${GITHUB_SHA}"

      - name: Package
        env:
          NAME: ${{ steps.build.outputs.name }}
          GOOS: ${{ matrix.goos }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage"
          if [ "$GOOS" = "windows" ]; then
            zip -qr "$RUNNER_TEMP/dist/${NAME}.zip" "$NAME"
          else
            tar -czf "$RUNNER_TEMP/dist/${NAME}.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
